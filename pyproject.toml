[tool.poetry]
# Tooling-only repo: there is no saos-labs package to install, only the
# helpers under scripts/. Without this, `poetry install` warns that it cannot
# find the package, and Poetry has said that warning becomes an error.
package-mode = false
name = "saos-labs"
version = "0.9.0"
description = "Automation helpers for Ciena SAOS containerlab labs."
authors = ["Ciena Recipes"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
mkdocs = "1.6.1"
# S3 renders a mermaid sequence diagram; the site cannot build without
# the plugin. Both pinned so a local build, lab-validation.yml, and the
# mirror's pages.yml (same pins) produce the same site.
mkdocs-mermaid2-plugin = "1.2.3"
pyyaml = "^6.0"
paramiko = "^3.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
