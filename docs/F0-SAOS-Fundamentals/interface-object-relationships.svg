<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
  <title id="title">SAOS interface object relationships</title>
  <desc id="desc">The physical interface maps through an Ethernet Trail Termination Point to a logical port. A flow point references the logical port, classifier, and forwarding domain. The forwarding domain is the Layer 2 underlay for the IP interface.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #172033; text-anchor: middle; }
      .subtitle { font: 14px Arial, sans-serif; fill: #5b6475; text-anchor: middle; }
      .card { stroke-width: 2; rx: 10; }
      .physical { fill: #e8f3ff; stroke: #3478b8; }
      .port { fill: #eeeafd; stroke: #6f5bb7; }
      .service { fill: #e8f7ed; stroke: #38875a; }
      .definition { fill: #fff4dc; stroke: #b17a19; }
      .heading { font: 700 16px Arial, sans-serif; fill: #172033; text-anchor: middle; }
      .detail { font: 13px Arial, sans-serif; fill: #4b5565; text-anchor: middle; }
      .line { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .reference { fill: none; stroke: #8a6d2f; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .loopback { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 10; }
    </style>
  </defs>

  <text x="700" y="42" class="title">How SAOS Interface Objects Fit Together</text>
  <text x="700" y="67" class="subtitle">Physical termination → service attachment → Layer 2 context → Layer 3 interface</text>

  <rect x="35" y="180" width="180" height="105" class="card physical"/>
  <text x="125" y="212" class="heading">Physical</text>
  <text x="125" y="233" class="heading">Interface</text>
  <text x="125" y="260" class="detail">PTP</text>

  <rect x="260" y="180" width="180" height="105" class="card physical"/>
  <text x="350" y="212" class="heading">ETTP</text>
  <text x="350" y="238" class="detail">Ethernet Trail</text>
  <text x="350" y="258" class="detail">Termination Point</text>

  <rect x="485" y="180" width="180" height="105" class="card port"/>
  <text x="575" y="212" class="heading">Logical</text>
  <text x="575" y="233" class="heading">Port</text>
  <text x="575" y="260" class="detail">Service attachment</text>

  <rect x="745" y="170" width="190" height="125" class="card port"/>
  <text x="840" y="207" class="heading">Flow Point (FP)</text>
  <text x="840" y="235" class="detail">Classification</text>
  <text x="840" y="257" class="detail">L2 transforms</text>
  <text x="840" y="279" class="detail">Logical port to FD</text>

  <rect x="995" y="180" width="180" height="105" class="card service"/>
  <text x="1085" y="212" class="heading">Forwarding</text>
  <text x="1085" y="233" class="heading">Domain (FD)</text>
  <text x="1085" y="260" class="detail">Layer 2 context</text>

  <rect x="1220" y="180" width="145" height="105" class="card service"/>
  <text x="1292.5" y="212" class="heading">IP</text>
  <text x="1292.5" y="233" class="heading">Interface</text>
  <text x="1292.5" y="260" class="detail">Layer 3</text>

  <rect x="745" y="85" width="190" height="65" class="card definition"/>
  <text x="840" y="113" class="heading">Classifier</text>
  <text x="840" y="135" class="detail">Frame-match definition</text>

  <path d="M215 232.5 H260" class="line"/>
  <path d="M440 232.5 H485" class="line"/>
  <path d="M665 232.5 H745" class="line"/>
  <path d="M935 232.5 H995" class="line"/>
  <path d="M1175 232.5 H1220" class="line"/>
  <path d="M840 150 V170" class="reference"/>

  <rect x="485" y="370" width="690" height="75" class="loopback"/>
  <text x="830" y="400" class="heading">Loopback Interface</text>
  <text x="830" y="426" class="detail">Standalone Layer 3 interface—no ETTP, logical port, classifier, FP, or FD</text>
</svg>
