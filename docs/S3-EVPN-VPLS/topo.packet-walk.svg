<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 2 1092 342" width="100%" font-family="Consolas, Monaco, monospace">
<title>Data-plane packet walk: a known-unicast frame from CE_1 to CE_2 across the E-LAN</title>
<style>
.hdr{font-size:11px;fill:#2d3436;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}
.stage-t{font-size:10px;font-weight:bold;fill:#2d3436;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}
.stage-s{font-size:8px;fill:#636e72;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}
.flow{stroke:#2d3436;stroke-width:1.5}
.encap-l{font-size:8px;fill:#0984e3;font-style:italic;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}
.seg{font-size:8px;fill:#2d3436;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}
.note{font-size:9px;fill:#808080;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}
</style>
<defs><marker id="fa" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2d3436"/></marker></defs>

<text x="560" y="26" class="hdr">Data plane — a known-unicast frame from CE_1 to CE_2 (both MACs already learned)</text>

<!-- stage boxes -->
<rect x="24"  y="70" width="120" height="72" rx="8" fill="#fbeeee" stroke="#900000"/>
<text x="84" y="98" class="stage-t">CE_1</text><text x="84" y="114" class="stage-s">172.16.106.1</text><text x="84" y="128" class="stage-s">frame → CE_2 MAC</text>

<rect x="248" y="70" width="200" height="72" rx="8" fill="#eaf4fb" stroke="#0984e3"/>
<text x="348" y="94" class="stage-t">PE_1 — ingress</text><text x="348" y="110" class="stage-s">classify vlan 106 → MAC-VRF elan_1</text><text x="348" y="124" class="stage-s">dest MAC known → impose labels</text>

<rect x="552" y="70" width="200" height="72" rx="8" fill="#eef7f2" stroke="#00b894"/>
<text x="652" y="94" class="stage-t">SR-MPLS core</text><text x="652" y="110" class="stage-s">transport label = prefix-SID to PE_2</text><text x="652" y="124" class="stage-s">unicast — PE_3 not on the path</text>

<rect x="856" y="70" width="200" height="72" rx="8" fill="#eaf4fb" stroke="#0984e3"/>
<text x="956" y="94" class="stage-t">PE_2 — egress</text><text x="956" y="110" class="stage-s">pop labels → MAC-VRF elan_1</text><text x="956" y="124" class="stage-s">push vlan 106 → local port</text>

<!-- flow arrows -->
<line x1="144" y1="106" x2="246" y2="106" class="flow" marker-end="url(#fa)"/>
<line x1="448" y1="106" x2="550" y2="106" class="flow" marker-end="url(#fa)"/>
<line x1="752" y1="106" x2="854" y2="106" class="flow" marker-end="url(#fa)"/>
<line x1="1056" y1="106" x2="1100" y2="106" class="flow" marker-end="url(#fa)"/>
<text x="1092" y="150" class="stage-t" text-anchor="end">CE_2</text>
<text x="1092" y="164" class="stage-s" text-anchor="end">172.16.106.2</text>

<!-- encapsulation stacks under each segment -->
<!-- CE_1 -> PE_1: customer single-tagged frame -->
<text x="195" y="212" class="encap-l">customer frame</text>
<rect x="150" y="222" width="42" height="20" fill="#fff" stroke="#2d3436"/><text x="171" y="235" class="seg">ETH</text>
<rect x="192" y="222" width="52" height="20" fill="#eaf4fb" stroke="#0984e3"/><text x="218" y="235" class="seg">vlan 106</text>
<rect x="244" y="222" width="44" height="20" fill="#fff" stroke="#2d3436"/><text x="266" y="235" class="seg">data</text>

<!-- core: MPLS-encapsulated -->
<text x="652" y="212" class="encap-l">encapsulated over SR-MPLS</text>
<rect x="470" y="222" width="70" height="20" fill="#eef7f2" stroke="#00b894"/><text x="505" y="235" class="seg">SR label</text>
<rect x="540" y="222" width="86" height="20" fill="#f6f4fd" stroke="#6c5ce7"/><text x="583" y="235" class="seg">EVPN svc label</text>
<rect x="626" y="222" width="70" height="20" fill="#fff" stroke="#2d3436"/><text x="661" y="235" class="seg">ctrl-word</text>
<rect x="696" y="222" width="42" height="20" fill="#fff" stroke="#2d3436"/><text x="717" y="235" class="seg">ETH</text>
<rect x="738" y="222" width="44" height="20" fill="#fff" stroke="#2d3436"/><text x="760" y="235" class="seg">data</text>

<!-- PE_2 -> CE_2: frame restored -->
<text x="915" y="212" class="encap-l">customer frame restored</text>
<rect x="870" y="222" width="42" height="20" fill="#fff" stroke="#2d3436"/><text x="891" y="235" class="seg">ETH</text>
<rect x="912" y="222" width="52" height="20" fill="#eaf4fb" stroke="#0984e3"/><text x="938" y="235" class="seg">vlan 106</text>
<rect x="964" y="222" width="44" height="20" fill="#fff" stroke="#2d3436"/><text x="986" y="235" class="seg">data</text>

<text x="560" y="300" class="note">The service (EVPN) label identifies the elan_1 MAC-VRF on PE_2; the SR transport label carries the packet across the core via PE_2's prefix-SID.</text>
<text x="560" y="326" class="note">BUM traffic (broadcast / unknown-unicast / multicast) instead follows the type-3 flood tree — PE_1 ingress-replicates a copy to every other PE in the E-LAN.</text>
</svg>
