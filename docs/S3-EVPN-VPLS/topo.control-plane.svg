<svg xmlns="http://www.w3.org/2000/svg" viewBox="106 2 788 576" width="100%" font-family="Consolas, Monaco, monospace">
<title>Control plane: BGP EVPN route exchange between the three MAC-VRFs</title>
<style>
.hdr{font-size:11px;fill:#2d3436;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}
.node-name{font-size:12px;font-weight:bold;fill:#2d3436;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}
.node-sub{font-size:9px;fill:#00b894;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}
.node-rt{font-size:8px;fill:#6c5ce7;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}
.evpn{stroke:#6c5ce7;stroke-width:1.5;stroke-dasharray:5 4}
.evpn-label{font-size:8px;fill:#6c5ce7;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}
.legtitle{font-size:9px;font-weight:bold;fill:#2d3436;paint-order:stroke;stroke:#fff;stroke-width:3}
.leg{font-size:8px;fill:#636e72;paint-order:stroke;stroke:#fff;stroke-width:3}
</style>
<defs>
<symbol id="saos" viewBox="0 0 36 36"><circle cx="18" cy="18" r="17" fill="#900000" stroke="#fff" stroke-width="2"/></symbol>
<marker id="arw" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6c5ce7"/></marker>
</defs>

<text x="500" y="28" class="hdr">Control plane — BGP EVPN route exchange, iBGP full mesh in AS 65032 (the SR-MPLS core carries it)</text>

<!-- EVPN sessions (bidirectional, dashed) -->
<line x1="288" y1="150" x2="712" y2="150" class="evpn" marker-start="url(#arw)" marker-end="url(#arw)"/>
<text x="500" y="142" class="evpn-label">EVPN type-2 + type-3</text>
<line x1="268" y1="170" x2="486" y2="384" class="evpn" marker-start="url(#arw)" marker-end="url(#arw)"/>
<text x="330" y="285" class="evpn-label">EVPN</text>
<line x1="732" y1="170" x2="514" y2="384" class="evpn" marker-start="url(#arw)" marker-end="url(#arw)"/>
<text x="670" y="285" class="evpn-label">EVPN</text>

<!-- PEs, each a MAC-VRF -->
<use href="#saos" x="232" y="132" width="36" height="36"/><text x="250" y="190" class="node-name">PE_1</text><text x="250" y="203" class="node-sub">MAC-VRF · RD 172.16.0.1:103</text><text x="250" y="215" class="node-rt">learns CE_1 MAC → type-2</text>
<use href="#saos" x="732" y="132" width="36" height="36"/><text x="750" y="190" class="node-name">PE_2</text><text x="750" y="203" class="node-sub">MAC-VRF · RD 172.16.0.2:103</text><text x="750" y="215" class="node-rt">learns CE_2 MAC → type-2</text>
<use href="#saos" x="482" y="382" width="36" height="36"/><text x="500" y="440" class="node-name">PE_3</text><text x="500" y="453" class="node-sub">MAC-VRF · RD 172.16.0.5:103</text><text x="500" y="465" class="node-rt">learns CE_3 MAC → type-2</text>

<!-- legend -->
<rect x="120" y="498" width="760" height="66" rx="8" fill="#f6f4fd" stroke="#6c5ce7" stroke-width="1"/>
<text x="135" y="516" class="legtitle">Shared route-target 0:103:103 (imported + exported on all three PEs) fuses the MAC-VRFs into one E-LAN; the RD is unique per PE.</text>
<text x="135" y="534" class="leg">type-2 (MAC/IP): each PE advertises its locally-learned customer MAC so the others install it and forward known-unicast directly.</text>
<text x="135" y="550" class="leg">type-3 (inclusive-multicast): each PE advertises E-LAN membership, building the BUM ingress-replication flood tree between the PEs.</text>
</svg>
