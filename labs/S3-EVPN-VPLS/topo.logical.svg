<svg xmlns="http://www.w3.org/2000/svg" viewBox="136 6 728 546" width="100%" font-family="Consolas, Monaco, monospace">
<title>Logical EVPN-VPLS E-LAN: three MAC-VRFs joined into one broadcast domain</title>
<style>
.bus-title{font-size:13px;font-weight:bold;fill:#2d3436;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}
.bus-sub{font-size:10px;fill:#0984e3;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}
.node-name{font-size:12px;font-weight:bold;fill:#2d3436;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}
.node-sub{font-size:9px;fill:#00b894;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}
.vrf{font-size:8px;fill:#6c5ce7;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}
.evpn{stroke:#6c5ce7;stroke-width:1.5;stroke-dasharray:5 4}
.evpn-label{font-size:8px;fill:#6c5ce7;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}
.ac{stroke:#2d3436;stroke-width:1.5}
.ac-label{font-size:8px;fill:#0984e3;font-style:italic;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}
.note{font-size:9px;fill:#808080;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}
</style>
<defs><symbol id="saos" viewBox="0 0 36 36"><circle cx="18" cy="18" r="17" fill="#900000" stroke="#fff" stroke-width="2"/></symbol></defs>

<text x="500" y="30" class="note">Logical view — the three PE MAC-VRFs form ONE Ethernet broadcast domain (contrast the physical SR-MPLS core above)</text>

<!-- E-LAN bus -->
<rect x="150" y="52" width="700" height="60" rx="10" fill="#eaf4fb" stroke="#0984e3" stroke-width="1.5"/>
<text x="500" y="80" class="bus-title">elan_1 — EVPN-VPLS E-LAN (EVI 103)</text>
<text x="500" y="99" class="bus-sub">one broadcast domain · vlan 106 · 172.16.106.0/24 · shared route-target 0:103:103</text>

<!-- EVPN membership (dashed) from bus to each MAC-VRF/PE -->
<line x1="270" y1="112" x2="270" y2="252" class="evpn"/><text x="270" y="186" class="evpn-label">EVPN type-2 / type-3</text>
<line x1="500" y1="112" x2="500" y2="252" class="evpn"/><text x="500" y="186" class="evpn-label">EVPN type-2 / type-3</text>
<line x1="730" y1="112" x2="730" y2="252" class="evpn"/><text x="730" y="186" class="evpn-label">EVPN type-2 / type-3</text>

<!-- PEs (each running a MAC-VRF) -->
<use href="#saos" x="252" y="250" width="36" height="36"/><text x="270" y="306" class="node-name">PE_1</text><text x="270" y="319" class="vrf">MAC-VRF · lo 172.16.0.1</text>
<use href="#saos" x="482" y="250" width="36" height="36"/><text x="500" y="306" class="node-name">PE_2</text><text x="500" y="319" class="vrf">MAC-VRF · lo 172.16.0.2</text>
<use href="#saos" x="712" y="250" width="36" height="36"/><text x="730" y="306" class="node-name">PE_3</text><text x="730" y="319" class="vrf">MAC-VRF · lo 172.16.0.5</text>

<!-- Attachment circuits (solid) PE -> CE -->
<line x1="270" y1="330" x2="270" y2="432" class="ac"/><text x="270" y="384" class="ac-label">vlan 106</text>
<line x1="500" y1="330" x2="500" y2="432" class="ac"/><text x="500" y="384" class="ac-label">vlan 106</text>
<line x1="730" y1="330" x2="730" y2="432" class="ac"/><text x="730" y="384" class="ac-label">vlan 106</text>

<!-- CEs -->
<use href="#saos" x="252" y="430" width="36" height="36"/><text x="270" y="486" class="node-name">CE_1</text><text x="270" y="499" class="node-sub">172.16.106.1/24</text>
<use href="#saos" x="482" y="430" width="36" height="36"/><text x="500" y="486" class="node-name">CE_2</text><text x="500" y="499" class="node-sub">172.16.106.2/24</text>
<use href="#saos" x="712" y="430" width="36" height="36"/><text x="730" y="486" class="node-name">CE_3</text><text x="730" y="499" class="node-sub">172.16.106.3/24</text>

<text x="500" y="534" class="note">type-2 (MAC/IP) routes carry learned customer MACs · type-3 (inclusive-multicast) routes build the BUM flood tree</text>
</svg>
