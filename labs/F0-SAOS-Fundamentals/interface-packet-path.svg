<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
  <title id="title">SAOS interface packet path</title>
  <desc id="desc">Ingress frames move from the physical interface through the Ethernet Trail Termination Point, logical port, flow point, forwarding domain, and IP interface. Egress traffic follows the reverse path. The classifier is a definition referenced by the flow point.</desc>
  <defs>
    <marker id="arrowIn" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3478b8"/>
    </marker>
    <marker id="arrowOut" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38875a"/>
    </marker>
    <marker id="arrowRef" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8a6d2f"/>
    </marker>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #172033; text-anchor: middle; }
      .subtitle { font: 14px Arial, sans-serif; fill: #5b6475; text-anchor: middle; }
      .card { stroke-width: 2; rx: 10; }
      .physical { fill: #e8f3ff; stroke: #3478b8; }
      .port { fill: #eeeafd; stroke: #6f5bb7; }
      .service { fill: #e8f7ed; stroke: #38875a; }
      .definition { fill: #fff4dc; stroke: #b17a19; }
      .heading { font: 700 17px Arial, sans-serif; fill: #172033; text-anchor: middle; }
      .detail { font: 13px Arial, sans-serif; fill: #4b5565; text-anchor: middle; }
      .ingress { fill: none; stroke: #3478b8; stroke-width: 3; marker-end: url(#arrowIn); }
      .egress { fill: none; stroke: #38875a; stroke-width: 3; marker-end: url(#arrowOut); }
      .reference { fill: none; stroke: #8a6d2f; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrowRef); }
      .laneIn { font: 700 14px Arial, sans-serif; fill: #3478b8; text-anchor: middle; }
      .laneOut { font: 700 14px Arial, sans-serif; fill: #38875a; text-anchor: middle; }
      .note { font: 13px Arial, sans-serif; fill: #667085; text-anchor: middle; }
    </style>
  </defs>

  <text x="700" y="42" class="title">Packet Flow Through the Same SAOS Objects</text>
  <text x="700" y="67" class="subtitle">Blue shows ingress; green shows the reverse egress path</text>

  <rect x="35" y="200" width="180" height="105" class="card physical"/>
  <text x="125" y="238" class="heading">Physical Interface</text>
  <text x="125" y="266" class="detail">Ethernet frame</text>
  <text x="125" y="286" class="detail">PTP</text>

  <rect x="260" y="200" width="180" height="105" class="card physical"/>
  <text x="350" y="238" class="heading">ETTP</text>
  <text x="350" y="266" class="detail">Ethernet trail</text>
  <text x="350" y="286" class="detail">termination</text>

  <rect x="485" y="200" width="180" height="105" class="card port"/>
  <text x="575" y="238" class="heading">Logical Port</text>
  <text x="575" y="266" class="detail">Service attachment</text>
  <text x="575" y="286" class="detail">bound to ETTP</text>

  <rect x="745" y="190" width="190" height="125" class="card port"/>
  <text x="840" y="231" class="heading">Flow Point (FP)</text>
  <text x="840" y="259" class="detail">Classifies traffic</text>
  <text x="840" y="281" class="detail">Applies ingress/egress</text>
  <text x="840" y="301" class="detail">L2 transforms</text>

  <rect x="995" y="200" width="180" height="105" class="card service"/>
  <text x="1085" y="238" class="heading">Forwarding Domain</text>
  <text x="1085" y="262" class="heading">(FD)</text>
  <text x="1085" y="286" class="detail">Layer 2 forwarding</text>

  <rect x="1220" y="200" width="145" height="105" class="card service"/>
  <text x="1292.5" y="238" class="heading">IP Interface</text>
  <text x="1292.5" y="266" class="detail">Layer 3</text>
  <text x="1292.5" y="286" class="detail">processing</text>

  <rect x="745" y="85" width="190" height="65" class="card definition"/>
  <text x="840" y="113" class="heading">Classifier</text>
  <text x="840" y="135" class="detail">Referenced by the FP</text>
  <path d="M840 150 V190" class="reference"/>

  <path d="M215 222 H260" class="ingress"/>
  <path d="M440 222 H485" class="ingress"/>
  <path d="M665 222 H745" class="ingress"/>
  <path d="M935 222 H995" class="ingress"/>
  <path d="M1175 222 H1220" class="ingress"/>

  <path d="M1220 283 H1175" class="egress"/>
  <path d="M995 283 H935" class="egress"/>
  <path d="M745 283 H665" class="egress"/>
  <path d="M485 283 H440" class="egress"/>
  <path d="M260 283 H215" class="egress"/>

  <text x="575" y="178" class="laneIn">INGRESS →</text>
  <text x="700" y="340" class="laneOut">EGRESS ← select and optionally transform before logical-port transmission</text>
  <text x="700" y="395" class="note">Services use logical ports through flow points; they are not configured directly on ETTPs.</text>
</svg>
