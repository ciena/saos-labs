<svg xmlns="http://www.w3.org/2000/svg" viewBox="26 124 1152 494" width="100%" font-family="Consolas, Monaco, monospace">
<style>.node{font-size:12px;font-weight:bold;fill:#2d3436;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}.sub{font-size:9px;fill:#00b894;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}.route{font-size:8px;fill:#6c5ce7;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}.note{font-size:9px;fill:#808080;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3}.link{stroke:#2d3436;stroke-width:1.5}.unused{stroke:#808080;stroke-width:1.5;stroke-dasharray:5 4}.lg{font-size:9px;fill:#636e72;paint-order:stroke;stroke:#fff;stroke-width:3}.lg-h{font-size:10px;font-weight:bold;fill:#2d3436;paint-order:stroke;stroke:#fff;stroke-width:3}.lg-p{fill:#fff;stroke:#dfe4e6;stroke-width:1}.pd{fill:#f4f6f7;stroke:#dfe4e6;stroke-width:1.5}.pd-t{font-size:10px;font-weight:bold;fill:#95a0a4;paint-order:stroke;stroke:#fff;stroke-width:3}</style>
<defs><symbol id="active" viewBox="0 0 36 36"><circle cx="18" cy="18" r="17" fill="#900000" stroke="#fff" stroke-width="2"/></symbol><symbol id="inactive" viewBox="0 0 36 36"><circle cx="18" cy="18" r="17" fill="#808080" stroke="#fff" stroke-width="2"/></symbol></defs>
