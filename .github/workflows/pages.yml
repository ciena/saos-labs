name: Pages

# Builds the MkDocs site from labs/ and deploys it through the Pages Actions
# deployment API (Settings → Pages → Source: GitHub Actions). The build job
# also runs on pull requests so a release PR that would break the site fails
# before it merges; only pushes to main (and manual runs) deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MkDocs
        # Same pins as pyproject.toml: a local build and the published site
        # must be the same site.
        run: pip install mkdocs==1.6.1 mkdocs-mermaid2-plugin==1.2.3
      - name: Build site
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
