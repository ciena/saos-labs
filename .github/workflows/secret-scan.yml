name: Secret Scan

# Satisfies SECURITY.md §4: the public repo must run a secret scanner and block
# real secrets while allowing RFC1918 / 2001:db8 documentation addresses (gitleaks'
# default rules flag credentials/keys, not example IPs). Pair with GitHub Secret
# Scanning + Push Protection in repo settings.
#
# We invoke the open-source gitleaks CLI (MIT) directly rather than the gitleaks
# GitHub Action, because that action requires a paid license for organization-owned
# repos. Running the binary is free and keeps the job on Node-free shell steps.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xzf - gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan working tree for secrets
        run: gitleaks dir . --no-banner --redact --exit-code 1
